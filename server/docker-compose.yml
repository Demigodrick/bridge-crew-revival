services:
  stbc-server:
    build: .
    image: stbc-server
    container_name: stbc-server
    restart: unless-stopped
    ports:
      - "${PORT:-4530}:${PORT:-4530}/tcp"   # game (Photon over TCP)
      - "${PORT:-8000}:${PORT:-8000}/tcp"   # room browser web page and JSON API
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Only needed for clients that don't run the Bridge Crew Revival mod's game-server
      # address rewrite: the address players can reach this server at.
      # PUBLIC_ADDRESS: "203.0.113.10:4530"
    env_file:
      - path: ./.env
        required: false
